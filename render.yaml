# Render Blueprint for Gameme (game + account server in one service).
#
# IMPORTANT: Render's free instances have an EPHEMERAL filesystem. The account file (users.json)
# would be erased on every redeploy, restart and idle spin-down, freeing every claimed name.
# Persistent disks need a paid instance type, so this blueprint uses "starter" with a disk.
services:
  - type: web
    name: gameme
    runtime: node
    plan: starter
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: gameme-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Optional: set a long random value to enable GET /api/admin/export and POST /api/admin/import (backup/restore).
      - key: ADMIN_TOKEN
        sync: false
      # Only needed if the website is hosted somewhere else (e.g. Vercel): comma-separated site origins.
      # - key: ALLOWED_ORIGINS
      #   value: https://your-site.vercel.app
